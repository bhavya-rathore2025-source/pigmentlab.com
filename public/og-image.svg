<svg width="1200" height="630" viewBox="0 0 1200 630" xmlns="http://www.w3.org/2000/svg" style="background:#0a0a0a; font-family:-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;">
  <defs>
    <radialGradient id="glow1" cx="20%" cy="25%" r="50%">
      <stop offset="0%" stop-color="#0070f3" stop-opacity="0.25"/>
      <stop offset="100%" stop-color="#0a0a0a" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="glow2" cx="85%" cy="75%" r="55%">
      <stop offset="0%" stop-color="#ff0080" stop-opacity="0.2"/>
      <stop offset="100%" stop-color="#0a0a0a" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="glow3" cx="75%" cy="20%" r="40%">
      <stop offset="0%" stop-color="#f9cb28" stop-opacity="0.18"/>
      <stop offset="100%" stop-color="#0a0a0a" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="paintGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0055ff"/>
      <stop offset="45%" stop-color="#00df89"/>
      <stop offset="75%" stop-color="#f5be0b"/>
      <stop offset="100%" stop-color="#ff2a5f"/>
    </linearGradient>
  </defs>

  <!-- Background and glows -->
  <rect width="1200" height="630" fill="#0a0a0a"/>
  <rect width="1200" height="630" fill="url(#glow1)"/>
  <rect width="1200" height="630" fill="url(#glow2)"/>
  <rect width="1200" height="630" fill="url(#glow3)"/>

  <!-- Subtle grid lines -->
  <g stroke="#222222" stroke-width="1" opacity="0.4">
    <line x1="80" y1="0" x2="80" y2="630"/>
    <line x1="1120" y1="0" x2="1120" y2="630"/>
    <line x1="0" y1="80" x2="1200" y2="80"/>
    <line x1="0" y1="550" x2="1200" y2="550"/>
  </g>

  <!-- Left Content Column -->
  <g transform="translate(80, 110)">
    <!-- Badge -->
    <rect x="0" y="0" width="285" height="34" rx="17" fill="#171717" stroke="#333333" stroke-width="1"/>
    <circle cx="18" cy="17" r="5" fill="#00df89"/>
    <text x="32" y="22" fill="#ededed" font-size="13" font-weight="600" letter-spacing="1">NEXT-GEN COLOR SCIENCE</text>

    <!-- Main Title -->
    <text x="0" y="95" fill="#ffffff" font-size="52" font-weight="700" letter-spacing="-1.5">
      Real Color Mixer
    </text>
    <text x="0" y="155" fill="#ffffff" font-size="52" font-weight="700" letter-spacing="-1.5">
      &amp; Color Wheel Picker
    </text>

    <!-- Description -->
    <text x="0" y="210" fill="#a1a1aa" font-size="20" font-weight="400">
      True subtractive pigment physics (Kubelka-Munk) meets Johannes
    </text>
    <text x="0" y="238" fill="#a1a1aa" font-size="20" font-weight="400">
      Itten's Bauhaus color wheel chart. Better than Adobe Color Wheel.
    </text>

    <!-- Feature Pills -->
    <g transform="translate(0, 280)">
      <rect x="0" y="0" width="165" height="36" rx="8" fill="#1a1a1a" stroke="#2e2e2e"/>
      <text x="14" y="23" fill="#e4e4e7" font-size="13" font-weight="500">Real Paint (RYB)</text>

      <rect x="180" y="0" width="175" height="36" rx="8" fill="#1a1a1a" stroke="#2e2e2e"/>
      <text x="194" y="23" fill="#e4e4e7" font-size="13" font-weight="500">Color Wheel Chart</text>

      <rect x="370" y="0" width="160" height="36" rx="8" fill="#1a1a1a" stroke="#2e2e2e"/>
      <text x="384" y="23" fill="#e4e4e7" font-size="13" font-weight="500">Hex Color Mixer</text>
    </g>

    <!-- Domain Footer -->
    <text x="0" y="380" fill="#71717a" font-size="16" font-family="monospace" font-weight="500">
      realcolormixer.com • 100% Free • WCAG 2.1 Contrast • CSS color-mix()
    </text>
  </g>

  <!-- Right Graphic: Interactive Wheel + Mixer Fusion -->
  <g transform="translate(930, 315)">
    <!-- Outer Glow Ring -->
    <circle cx="0" cy="0" r="180" fill="none" stroke="url(#paintGrad)" stroke-width="22" opacity="0.85"/>
    
    <!-- 12-Hue Segments dots -->
    <circle cx="0" cy="-180" r="12" fill="#ffe600" stroke="#ffffff" stroke-width="2"/>
    <circle cx="90" cy="-156" r="11" fill="#ff9900"/>
    <circle cx="156" cy="-90" r="11" fill="#ff3300"/>
    <circle cx="180" cy="0" r="12" fill="#e60026" stroke="#ffffff" stroke-width="2"/>
    <circle cx="156" cy="90" r="11" fill="#990066"/>
    <circle cx="90" cy="156" r="11" fill="#4c0080"/>
    <circle cx="0" cy="180" r="12" fill="#0033aa" stroke="#ffffff" stroke-width="2"/>
    <circle cx="-90" cy="156" r="11" fill="#0077aa"/>
    <circle cx="-156" cy="90" r="11" fill="#009988"/>
    <circle cx="-180" cy="0" r="12" fill="#00aa44" stroke="#ffffff" stroke-width="2"/>
    <circle cx="-156" cy="-90" r="11" fill="#66bb22"/>
    <circle cx="-90" cy="-156" r="11" fill="#aacc00"/>

    <!-- Inner Core: Real mixing simulation -->
    <circle cx="0" cy="0" r="115" fill="#121212" stroke="#262626" stroke-width="2"/>
    <path d="M-60,-30 C-30,-70 30,-70 60,-30 C75,0 55,40 0,70 C-55,40 -75,0 -60,-30 Z" fill="url(#paintGrad)" opacity="0.9"/>
    
    <text x="0" y="-5" text-anchor="middle" fill="#ffffff" font-size="16" font-weight="700">BLUE + YELLOW</text>
    <text x="0" y="18" text-anchor="middle" fill="#00df89" font-size="15" font-weight="600">= PURE GREEN</text>
    <text x="0" y="36" text-anchor="middle" fill="#888888" font-size="11" font-family="monospace">#3D933E</text>
  </g>
</svg>
